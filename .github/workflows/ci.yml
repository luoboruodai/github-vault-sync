name: Desktop plugin verification

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Node 22
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Check Git LFS availability
        run: git lfs version
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check packaged files match this source and build
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/release_archive.py verify
      - name: Explain package check is deferred for main/PR development builds
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo 'No release ZIP is required for an unreleased development commit; tag CI enforces the archive check.'
